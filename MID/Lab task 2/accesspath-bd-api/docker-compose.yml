services:
  db:
    image: postgres:16
    container_name: accesspath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: accesspath_db
    ports:
      - "5432:5432"
    volumes:
      - accesspath_pgdata:/var/lib/postgresql/data

volumes:
  accesspath_pgdata: